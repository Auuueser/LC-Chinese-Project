<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LC Chinese Project</title>
  <desc id="desc">Lethal Company V81 简体中文汉化项目</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0B"/>
      <stop offset="0.58" stop-color="#17120F"/>
      <stop offset="1" stop-color="#29130A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A21"/>
      <stop offset="1" stop-color="#C93E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 310H1200" stroke="#FF6220" stroke-width="3" opacity="0.75"/>
  <path d="M850 0L1200 0 1200 360 1030 360Z" fill="#E24D13" opacity="0.08"/>
  <g filter="url(#shadow)">
    <text x="86" y="184" fill="#F2EEE7" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="150" letter-spacing="7">V81</text>
    <rect x="84" y="220" width="324" height="10" rx="5" fill="url(#accent)"/>
  </g>
  <text x="490" y="142" fill="#FF6720" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="28" font-weight="700" letter-spacing="6">LC CHINESE PROJECT</text>
  <text x="486" y="226" fill="#F4F0E9" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="72" font-weight="800" letter-spacing="5">中文汉化</text>
  <text x="490" y="273" fill="#BDB6AD" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="23" letter-spacing="2">原版覆盖 · 动态文本 · 中文字体 · 模组兼容</text>
  <g fill="none" stroke="#FF6720" stroke-width="2" opacity="0.5">
    <path d="M1110 72h34v34"/>
    <path d="M1110 288h34v-34"/>
  </g>
</svg>
