it still sucks here, Rich still smells like a piece of hsit .i can barely sleep. i heard the wrorst sound behind the wall of the company building, it sounded like the pestle and bowl my mom crushed up her seeds and spices in. i still hear it. no one else heard it. Jess thinks i;m "home sick," no im sick of this cheap suit=这里还是烂透了，Rich 还是臭得像一坨屎。我几乎睡不着。我听见公司大楼墙后面传来最糟糕的声音，听起来像我妈妈捣碎种子和香料用的杵和碗。我现在还听得见。别人都没听到。Jess 觉得我是“想家”，不，我是受够这套便宜制服了
for some reason i was the one who had to call the company number to report the acciddent. they were too scared to do it. It was the same fake voice i remember from the interview on the phone at home and the stupid training videos. but it heard what i said i think, cause it said they would contact the family and find a replacement and something e lse. It talked so fast=不知道为什么，最后是我打电话给公司号码去报告事故。他们太害怕了不敢打。那声音跟我记得的一样假，和我在家里电话面试时听到的声音、还有那些愚蠢培训视频里的声音一样。但我觉得它听见我说的话了，因为它说他们会联系家属、找替补，还有别的什么。它说得太快了
