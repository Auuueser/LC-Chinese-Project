Cause of death:=死因：
To make a radar booster play a noise.=让雷达增强器播放声音。
To access objects placed into storage.=访问已放入仓库的物品。
To switch view to a player on the main monitor=在主监视器上切换到某名玩家的视角
To toggle on AND off the main monitor's map cam=开启或关闭主监视器地图摄像头
To transmit a message with the signal translator=使用信号翻译器发送消息
To read a log, use keyword "VIEW" before its name.=若要阅读日志，请在名称前输入关键字“VIEW”。
To get through locked doors efficiently, order a <u>lock-picker</u> from the ship terminal.=若要高效通过锁门，请从飞船终端订购 <u>开锁器</u>。
Use the "PING" command before the radar booster's name to play a special sound from the device=在雷达增强器名称前使用“PING”命令，让设备播放特殊声音
Tip: This may occur due to an antivirus or other software halting the save file from being read.=提示：这可能是杀毒软件或其他软件阻止读取存档造成的。
With an extra battery life and even brighter bulb, your colleagues can never leave you in the dark again=更长续航和更亮灯泡，让同事再也不能把你留在黑暗中
Could not connect to Steam servers! (If you just want to play on your local network, choose LAN on launch.)=无法连接到 Steam 服务器！（如果只想在本地网络游玩，请在启动时选择 LAN。）
Use the "SWITCH" command before the radar booster's name to view it on the main monitor. It must be activated=在雷达增强器名称前使用“SWITCH”命令，即可在主监视器查看它。它必须处于激活状态
Use the "transmit" command to broadcast a text message to all crewmates. The message must be under 10 letters=使用“transmit”命令向所有船员广播文本消息。消息必须少于 10 个字符
While moving furniture with [B], you can press [X] to send it to storage. You can call it back from storage here.=使用 [B] 移动家具时，可按 [X] 将其送入仓库。你可以在这里从仓库召回。
To access a creature file, type "INFO" after its name.=若要查看生物档案，请在名称后输入“INFO”。
TIP!: Hold [R-Trigger] to vote for the autopilot ship to leave early.=提示！按住 [R-Trigger] 投票让自动驾驶飞船提前离开。
CONDITIONS: March undergoes constant drizzling weather. Its terrain is more expansive.=环境：March 长期细雨连绵，地形更加开阔。
Previously mined for its rich industrial resources, Liquidation is now largely an ocean moon.=Liquidation 曾因丰富工业资源而被开采，如今大部分区域是海洋卫星。
CONDITIONS: Similar to its twin moon, 41-Experimentation, featuring far more jagged and weathered terrain.=环境：类似其双子卫星 41-Experimentation，但地形更加参差且风化严重。
HISTORY: 220-Assurance is far younger than its counterpart. Discovered not long before 41-Experimentation.=历史：220-Assurance 比它的对应卫星年轻得多，发现时间略早于 41-Experimentation。
CONDITIONS: Its planet orbits white dwarf star, making for inhospitable, cold conditions. Constant blizzards decrease visibility.=环境：该行星围绕白矮星运行，环境寒冷且难以居住。持续暴风雪会降低能见度。
HISTORY: Not discovered for quite some time due to its close orbit around gas giant Big Grin. However it appears to have been used in secret.=历史：由于紧密环绕气态巨行星 Big Grin，它很长时间未被发现。但这里似乎曾被秘密使用。
HISTORY: Several famous travelers went missing here, giving it some reputation. Their bodies are unlikely to be found due to the planet's conditions.=历史：数位知名旅行者在此失踪，使这里有了一定名声。受行星环境影响，他们的遗体很可能无法找到。
CONDITIONS: Believed to have splintered off from its cousin Assurance, Offense features similar jagged and dry conditions but differs in its ecosystem.=环境：据信 Offense 从其近亲 Assurance 分裂而来，有相似的崎岖干燥环境，但生态系统不同。
HISTORY: Vow appears to have been inhabited by several colonies across its continents, but there is now no sign of life, and they have become a mystery.=历史：Vow 的各大陆似乎曾有多个殖民地，但如今已无生命迹象，成了谜团。
Go here to drop off any valuable scrap you've collected while on the job. The rate of return updates hourly and fluctuates over the course of several days.=前往此处交付工作中收集的贵重废料。回收率每小时更新，并会在数日内波动。
Lock-pickers will unlock your limitless potential for efficiency on the job. Powered by proprietary AI software, they will get you access through any locked door=开锁器将释放你在工作效率上的无限潜力。它由专有 AI 软件驱动，可帮你通过任何上锁的门
Used to communicate with any crew member from any distance, no walkie talkie required! The horn can be heard from anywhere. But what does it mean? That's up to you=可与任意距离外的船员通信，不需要对讲机！号角在任何地方都能听见。但它代表什么？由你决定
HISTORY: It looks like this moon was mined for resources. It's easy to get lost within the giant industrial complex. There are many entrances to it littered about the landscape.=历史：这颗卫星似乎曾被开采资源。巨型工业设施内很容易迷路，地表散布着许多入口。
Welcome to\\n=欢迎抵达\n
This experience has been designed for in-game voice chat, so I recommend giving it a try.\\n\\n=此体验围绕游戏内语音聊天设计，建议你尝试使用。\n\n
Press the button to activate the teleporter. It will teleport whoever is currently being monitored on the ship's radar. They will not be able to keep any of their held items through the teleport. It takes about ten seconds to recharge=按下按钮启动传送器。它会传送当前由飞船雷达监控的目标。被传送者无法保留手持物品。充能约需十秒
HISTORY: 21-Offense is categorized as an asteroid moon and seems to have not existed on its own for more than several hundred years. The industrial artifacts here have suffered damage; it's believed they were built long before 21-Offense was splintered off.=历史：21-Offense 归类为小行星卫星，似乎独立存在的时间不超过数百年。这里的工业遗物受损严重，推测它们早在 21-Offense 分裂出来之前就已建成。
The inverse teleporter is a modified teleporter which will teleport you to a random position outside the ship. All your items will be dropped at the teleporter before transport. The inverse teleporter can be used by everyone at once and has a 3.5 minute cooldown=反向传送器是改造版传送器，会把你传送到飞船外的随机位置。传送前你的所有物品会掉在传送器旁。反向传送器可让所有人同时使用，冷却时间为 3.5 分钟。
This safe and legal medicine can be administered to see great benefits to your performance on the job! Your ability to move LONG distances while carrying HEFTY objects will be second to none! Warning: TZP gas may impact the brain with extended exposure. Follow instructions manual provided with the canister=这种安全合法的药剂可经由吸入施用，并能短暂提升你的能力。
The extension ladder can reach as high as nine meters! Use it to scale any cliff and reach for the stars! To save batteries the extension ladder automatically stores itself after 18 seconds=伸缩梯最高可达九米！用它攀上悬崖，向星辰伸手！为节省电量，伸缩梯会在 18 秒后自动收回
Useful for keeping in touch! Hear other players when the wakie talkie is in your inventory. Must be in your hand and pressed down to transmit voice=用于保持联络！对讲机在物品栏中时可听到其他玩家。必须拿在手中并按住才能发送语音
LASSO\\n\\nSigurd's danger level: 30% but it kinda freaks me out=套索兽\n\n西格德危险等级：30%，但它有点吓到我了
EARTH LEVIATHAN\\n\\nSigurd's danger level: 2% cause they can't hide from the ship cmaeras!!\\n\\nScientific name: Hemibdella-gigantis\\nThe reverently named Earth Leviathan, of the family Piscicolidae, is one of the largest invertibrates found around the Thistle Nebula. None have been captured, so not much is known of their biology. \\n\\nThey seem to behave as predators. It's speculated they can burrow as far as 40 meters underground, judging by the incredible excavations they can leave behind. They can detect even the slightest vibrations, and for this reason it's not recommended to stay still if they are nearby; that is a myth. Instead, if you hear them burrowing, retrace your steps.=大地利维坦\n\n西格德危险等级：2%，因为它们躲不过飞船摄像头！！\n\n学名：Hemibdella-gigantis\n受敬畏之名的大地利维坦隶属 Piscicolidae 科，是蓟星云附近发现的最大无脊椎动物之一。尚无个体被捕获，因此我们对其生物学了解不多。\n\n它们似乎具有捕食行为。从它们留下的巨大掘痕推测，它们能钻到地下约 40 米深。它们能感知极其轻微的震动，因此如果附近有它们，不建议站着不动；那只是误传。相反，如果你听见它们正在掘进，就沿原路退回去。
Roaming Locusts\\n\\nSigurd's danger level: 0%\\n\\nScientific name: Anacridium-vega\\n\\nKnown as roaming locusts, this is a species of grasshopper. Unlike some species which are more prone to jump or fly, roaming locusts are almost never grounded and stay close together even when in smaller numbers. They will quickly disperse when a predator disrupts them but are highly attracted to light.\\n\\n=游荡蝗群\n\n西格德危险等级：0%\n\n学名：Anacridium-vega\n\n俗称游荡蝗群，是一种蚱蜢。不同于更倾向跳跃或飞行的物种，游荡蝗群几乎从不落地，即使数量较少也会聚在一起。捕食者惊扰它们时，它们会迅速散开，但它们非常受光吸引。\n\n
SNARE FLEA\\n\\nSigurd's danger level: 30%\\n\\nScientific name: Dolus-scolopendra. \\nA very large arthropod of the class chilopoda. Its body produces a silk which it primarily uses to propel itself to places where it is concealed. Its exoskeleton is somewhat fragile, and they can die from long falls. The snare flea does not produce venom, nor does it have a strong bite. It makes up for this weakness with its ability to tighten itself around large prey to suffocate.\\n\\nThe snare flea thrives in dark, warm areas. It cannot survive low temperatures and generally avoids open air and sunlight take the rats outside or just beat the hell otu of them! i think their insides could make a good milkshake,,\\n\\n=抱脸虫\n\n西格德危险等级：30%\n\n学名：Dolus-scolopendra。\n一种非常大型的唇足纲节肢动物。它的身体会产生丝，主要用来把自己推送到隐蔽位置。它的外骨骼比较脆弱，可能因高处坠落而死亡。抱脸虫不产毒，咬合力也不强。它以缠紧大型猎物并使其窒息的能力弥补这些弱点。\n\n抱脸虫适合生活在黑暗温暖的区域。它无法在低温下存活，通常避开开阔空气和阳光。把这些虫子带到外面，或者狠狠揍一顿！我觉得它们的内脏能做成不错的奶昔,,\n\n
COIL-HEADS\\n\\nSigurd's danger level: 80%\\n\\nScientific name: Vir colligerus\\nVir colligerus, or colloquially named Coil-heads, are a recent discovery and have not been studied extensively due to their extreme unpredictability and dangerous properties. They have been known to combust into flames when being dissected or even deactivated, and they carry dangerously high levels of radioactive particles. Due to this and other reasons, it has been highly speculated they were created as biological weapons of war, although this has not been proven.\\n\\nCoil-heads' visual appearance is that of a bloody mannequin with its head connected by a spring. Their defining behavioral characteristic is to stop when being looked at. However, this does not appear to be a hard-and-fast rule. When they encounter a loud or bright light they sometimes appear to enter a long reset mode. \\nJust stare at htem or use a stun grenade! - Sigurd\\n\\n=弹簧头\n\n西格德危险等级：80%\n\n学名：Vir colligerus\nVir colligerus，俗称弹簧头，是近期发现的物种；由于极端不可预测且具危险性，尚未被充分研究。已知它们在被解剖甚至停用时可能燃烧起火，并携带危险水平的放射性粒子。基于这些及其他原因，有强烈推测认为它们是作为战争生物武器制造的，但这一点尚未得到证明。\n\n弹簧头外观像一具带血的人体模型，头部由弹簧连接。它们最典型的行为特征是在被注视时停止移动。不过，这似乎不是绝对规则。遇到巨大声响或强光时，它们有时会进入漫长的重置状态。\n盯着它们看，或者用震撼手雷！——西格德\n\n
Spore lizard\\n\\nSigurd's danger level: i ,dont know probably 5% i just hate this pudgy legged little sh it\\n\\nScientific name: Lacerta-glomerorum\\nColloquially named puffers or spore lizards, Lacerta-glomerorum (of the family Alligatoridae) is one of the largest and heaviest reptiles. Despite their large mouths, they are herbivores and do not have a strong bite. The bulbs on their tails are believed to secrete a chemical which attracts and accelerates the growth of the fungus species Lycoperdon perlatum, which it can then shake to release spores as a defense mechanism--an unique example of a mutualistic symbiotic relationship.\\n\\nSpore lizards have a very timid temperment, tending to avoid all confrontation if possible. If their attempts at threat display are not effective, they may attempt to attack, so it's not recommended to corner or chase one. There are historical records that spore lizards were at least partially domesticated hundreds of years ago, however this effort was set aside by an initiative to harvest their tails for their medicinal properties.=孢子蜥蜴\n\n西格德危险等级：我，不知道，大概 5%，我只是讨厌这只胖腿小混蛋\n\n学名：Lacerta-glomerorum\nLacerta-glomerorum（鳄科）俗称鼓气蜥或孢子蜥蜴，是最大也最重的爬行动物之一。尽管嘴很大，它们是食草动物，咬合力并不强。其尾部囊泡被认为会分泌一种化学物质，吸引并加速网纹马勃（Lycoperdon perlatum）真菌生长，随后它可通过摇动尾部释放孢子作为防御机制，这是互利共生关系的独特例子。\n\n孢子蜥蜴性情非常胆怯，尽可能避免所有冲突。如果威吓展示无效，它们可能尝试攻击，因此不建议逼入角落或追赶。历史记录显示，数百年前孢子蜥蜴至少曾被部分驯化；但后来为了采集其尾部药用性质，这一努力被搁置。
FOREST KEEPER\\n\\nSigurd's danger level: 50%\\n\\nScientific name: Satyrid-proceritas\\nBelieved to share a common ancestor with rapax-folium, these behemoths are called Forest Keepers for the biomes they often inhabit. Their bodies bare markings on their front and back which mimic eyes--this trait is more helpful in their youth, as they are not agile. Their skin is a unique, dense material which hardens further throughout their lives; the large spikes and bumps across their bodies form as a result of aging.\\n\\nIt's been said Forest Keepers exhibit a curious behavior similar to that of a human child the age of 5 or 6. They will eat anything they find fascinating. Forest Keepers don't actually need to put anything into their mouths, and it's theorized their main source of energy is a process similar to photosynthesis. Still, this makes them relatively dangerous to observe. They can see across long distances, so staying low and making use of cover is a must. They cannot enter small spaces and are not generally destructive, so stay close to shelter or overhangs.=森林守卫\n\n西格德危险等级：50%\n\n学名：Satyrid-proceritas\n这些庞然大物被认为与 rapax-folium 拥有共同祖先，并因常栖息的生物群系被称为森林守卫。它们身体前后有模仿眼睛的花纹；这一特征在幼年时更有用，因为它们并不敏捷。它们的皮肤是一种独特而致密的材料，并会在一生中继续硬化；遍布身体的大型尖刺和凸起是衰老造成的结果。\n\n据说森林守卫表现出类似五六岁人类儿童的好奇行为。它们会吃掉任何觉得有趣的东西。森林守卫实际上不需要把任何东西放入口中，有理论认为其主要能量来源类似光合作用。尽管如此，这也让观察它们相当危险。它们能看见很远的距离，因此保持低姿态并利用遮蔽物是必须的。它们无法进入狭小空间，通常也不具破坏性，所以应靠近掩体或悬垂结构。
Bracken -- AKA flower man!\\n\\nit was flower man, you can't say othrwise! i wanted to find his body .You were the cowards\\n\\nScientific name: Rapax-folium\\nThere is debate on the genus to which the Bracken belongs. It is a bipedal vertebrate with skin the color and texture of a red beat. The name was coined for what appear to be leaves protruding from its upper spine. The purpose of these is believed to be for intimidation, however not much is known about the specifics of bracken behaviour due to its illusiveness and low population.\\n\\nWe know a little from accounts by wildlife experts who have encountered it. is a lone hunter with high intelligence. Its behavior can seem aloof; it exhibits high aggression even when unprovoked, yet it quickly backs off when confronted. However, brackens are known to up their hostility when cornered or simply watched for a long time. For this reason it's recommended to keep an eye on it but not to stare it down. No specimens have been collected dead or alive. It's theorized that upon death their bodies undergo a rapid decomposition process which is unique from other large animals.\\n\\n=布拉肯——也叫花人！\n\n就是花人，你们别想说不是！我想找到他的尸体。你们才是胆小鬼\n\n学名：Rapax-folium\n关于布拉肯应归入哪个属仍有争议。它是一种双足脊椎动物，皮肤颜色和质感类似红甜菜。其名称来自上脊柱伸出的叶片状结构。一般认为这些结构用于威吓；但由于它行踪隐秘、数量稀少，我们对布拉肯行为细节了解不多。\n\n我们从遭遇过它的野生动物专家记录中知道一点：它是高智力的独行猎手。它的行为有时显得疏离；即使未受挑衅也会表现出高度攻击性，但被正面应对时又会迅速退开。不过，已知布拉肯在被逼入角落或被长时间盯视时会提高敌意。因此建议持续留意它，但不要死死盯住。尚未收集到死亡或活体样本。有理论认为，它们死亡后会经历一种不同于其他大型动物的快速分解过程。\n\n
Circuit Bees\\n\\nSigurd's danger level: 90%\\n\\nScientific name: Crabro-coruscus\\nThe circuit bee, also known as red bee, is a eusocial flying insect of the genus Apis, a descendent of the honey bee. Their appearance is quite recognizable from their hairy, red bodies and two sets of wings. Like their ancestors, they are well-known for their intelligent social BEEhavior, large colony size, building wax nests which they use to store honey, and their important role in pollination. Unlike the honey bee, which often chose high places such as trees to construct its hive, red bees create their hives on the ground.\\n\\nRed bees are highly defensive. They will leave the nest to attack any creature that comes within several meters, leaving BEEhind only the queen and drone bees. This bold BEEhavior is enabled by their most defining aBEElity, which is their electrostatic charge. Red bees produce friction with the air. They also produce friction by rubbing their two pairs of wings against each other and by rubbing against one another while in the hive. What allows them to create such a surplus of electric field compared to the honey bee is still under research, as they generate a stronger electric field when panicked or angered. This ability is especially useful for them around water.\\n\\n\\n\\nIt's BEEst to keep your distance. If a red bee hive is stolen, red bee swarms will enter an onslaught in which they attack any living creature. This destructive BEEhavior will last until they have located the hive or completely exhausted themselves, which can take hours to days. They have BEEn known to leave BEEhind fields of bodies of small rodents, insects and even some larger mammals, and in rare cases they can start fires. Their strong BEEnefits and drawbacks to their ecosystems are highly debated. BEEbated !! - the indomitable Sigurd=电路蜂\n\n西格德危险等级：90%\n\n学名：Crabro-coruscus\n电路蜂，也称红蜂，是蜜蜂属的真社会性飞行昆虫，是蜜蜂的后代。它们毛茸茸的红色身体和两对翅膀很容易辨认。和祖先一样，它们以聪明的社会行为、庞大的群落规模、筑蜡巢储蜜以及重要的授粉作用而知名。不同于常选择树木等高处筑巢的蜜蜂，红蜂会在地面建立蜂巢。\n\n红蜂防御性极强。任何生物进入几米范围内，它们都会离巢攻击，只留下蜂后和雄蜂。这种大胆行为来自其最突出的能力：静电荷。红蜂会与空气摩擦，也会让两对翅膀彼此摩擦，并在巢内相互摩擦。它们为何比蜜蜂产生如此过量的电场仍在研究中；当恐慌或愤怒时，它们会产生更强电场。这种能力在水边尤其有用。\n\n\n\n最好保持距离。如果红蜂蜂巢被偷，红蜂群会进入猛攻状态，攻击任何活物。这种破坏性行为会持续到它们找到蜂巢或完全耗尽体力，可能持续数小时到数天。已知它们会留下小型啮齿动物、昆虫甚至部分大型哺乳动物的尸体，有少数情况下还会引发火灾。它们对生态系统强烈的利弊仍存在很大争议。蜂议！！——不可征服的西格德
Baboon hawk\\n\\nSigurd's danger level: 75%\\n\\nScientific name: Papio-volturius\\nBaboon hawks are a primate of the family Cercopithecidae. They are hunchbacked but can stand up to 8 feet on average. Their heads are boney, with bird-like beaks and long horns, which they use like skewers to gore and feed on prey. Their horns are made of keratin instead of bone like the rest of their skulls, and they do not contain nerves or blood vessels. As a result baboon hawks can often break their horns from the force they apply, then fully regrow them within the same season. Baboon hawks partly owe their name to their large wings, which could never carry their large body mass and are used instead for intimidation and protection from the elements.\\n\\nThe largest baboon hawk troop ever observed was made up of 18 baboon hawks. They are loosely territorial, and much of their behavior is motivated by intimidation and display. They can become collectors, using any flashy or colorful object to mark their territory. As lone scouts, baboon hawks are generally timid and won't attack unless provoked. In greater numbers they can become a great danger; sticking close to others and making yourself seem dangerous are the best ways to prevent an attack. They prefer smaller mammals, but when desperate they are known to use their numbers to attack animals even twice their size, such as eyeless dogs. THEY TOOK M Y PICKLES\\n\\n=狒狒鹰\n\n西格德危险等级：75%\n\n学名：Papio-volturius\n狒狒鹰是猴科灵长类动物。它们驼背，但平均可站到 8 英尺高。头部多骨，带有鸟喙般的嘴和长角，并会像用叉子一样用角刺穿猎物、进食。它们的角由角蛋白构成，不像头骨其余部分那样是骨质，也不含神经或血管。因此狒狒鹰常因用力过猛折断角，但能在同一季节内完全再生。狒狒鹰名称的一部分来自它们的大型翅膀；这些翅膀无法承载其庞大体重，主要用于威吓和抵御环境。\n\n观测到的最大狒狒鹰群由 18 只组成。它们有松散的领地性，大多数行为都受威吓和展示驱动。它们可能成为收集者，用任何闪亮或鲜艳物品标记领地。作为单独侦察者时，狒狒鹰通常胆怯，除非被挑衅不会攻击。数量较多时则非常危险；靠近同伴并让自己显得危险，是防止攻击的最佳方式。它们偏好小型哺乳动物，但在绝望时会依靠数量攻击体型两倍于自己的动物，例如无眼犬。它们抢走了我的腌黄瓜\n\n
Manticoils\\n\\nSigurd's danger level: 0%\\n\\nScientific name: Quadrupes-manta\\nMantacoils are a passerine bird of the family corvidae. Their bodies are quite large compared to their early descendants, and their wingspan ranges from 55 to 64 inches. Their most defining characteristic is their set of four wings. Their back wings are mostly used to stabilize when at low speed, while their front two wings create the majority of lift. Their round bodies are a striking yellow but with black outlines or stripes along their primary (rear) feathers.\\n\\nManticoils mostly feed on small insects but can also feed on small rodents. They are highly intelligent and social. They pose little threat and have a generally passive temperament towards humans, although they are capable of transmitting Rabies, Rubenchloria, and Pitt Virus.\\n\\n=四翼鸟\n\n西格德危险等级：0%\n\n学名：Quadrupes-manta\n四翼鸟是鸦科雀形目鸟类。与早期后代相比，它们身体相当大，翼展为 55 到 64 英寸。其最显著特征是四只翅膀。后翼主要用于低速时稳定，前两翼则产生大部分升力。它们圆润的身体呈醒目黄色，主羽（后羽）边缘或条纹为黑色。\n\n四翼鸟主要以小昆虫为食，也可捕食小型啮齿动物。它们高度聪明且具社会性。它们威胁很小，对人类通常性情被动，但能够传播狂犬病、Rubenchloria 和 Pitt 病毒。\n\n
