i know im not the wizard but I guess im the computer guy again today. every time i go outside on vow they say i get pale like im dead, so they put me on screen duty. they think i got soft or something. whatever, Mr. Doofus Lucas is the scared one. good luck keeping him from losing his freaking mind. I could stroll out at night like its my back yard!! Its just that i saw Rich on a hill. he was over on the orther side of the river. but that was three days ago. Im not scared, its just getting cold outside. i think they jus twant me to have screen duty every day now, and they all got an excuse=我知道我不是那个巫师，但今天看来我又是电脑员了。每次我到 Vow 外面，他们都说我脸色白得像死人，所以就让我看监视器。他们觉得我变软弱了什么的。随便吧，蠢蛋 Lucas 才是害怕的那个。祝他们好运，别让他彻底发疯。我晚上都能像在自家后院一样走出去！！只是我在山上看见了 Rich。他在河的另一边。但那已经是三天前了。我不是害怕，只是外面越来越冷。我觉得他们现在只是想让我每天都看监视器，而且每个人都有借口
i miss dad. i hope he isnt staying on titan. people are saying its not going to look the same in two years. jess told us they a re about to go to war and everyone is just waiting for it. every time we go to sell, the company building is shaking like theres a loud furnace inside. we can barely sleep to meet the quota, and it gets worse every time. God, i feel like im being squeezed through a needle. i wish we could go back. it was better working for Dad even when i got nothing, just daily alowance. i liked when he would drive us out of town to see the waterfall and we walked up those old wooden stairs. I just wanted a real job=我想爸爸了。我希望他没有留在 Titan。大家都在说那里两年后就不会是现在这样了。Jess 告诉我们，他们马上要开战，所有人都在等着。每次我们去卖东西，公司大楼都在震，好像里面有个很吵的熔炉。我们几乎睡不了觉就得赶配额，而且每次都更糟。天啊，我感觉自己像被挤过针眼。我希望我们能回去。以前给爸爸干活更好，就算我什么都拿不到，只有每天的零用钱。我喜欢他开车带我们出城去看瀑布，然后我们沿着那些旧木台阶往上走的时候。我只是想要一份真正的工作
I talked ot a voice on the walkie talkie, it was like a part of the pestle and morter. he told me the Golden planet actually existed, its not a legend. and he told me it didn't just hit a meteor. He said the planet was swallowed up by the "beast", and they were in its body being diggested. i asked what the beast is, and he said he didnt know!. he said it ate the planet and they forgot everything=我用对讲机和一个声音说话，它听起来像杵和臼的一部分。他告诉我黄金星球真的存在，不是传说。他还告诉我，它不是被陨石砸中的。他说那颗星球被“野兽”吞掉了，而他们在它的身体里被消化。我问那头野兽是什么，他说他不知道！他说它吃掉了那颗星球，然后他们忘记了一切
i couldnt get him to stop talking. but i said he was on the other side of a big wall and i could get him out. i said he was inside the building. and thats when he started freaking out/. i couldn't make out a word, I think he said something about "spitting out the rinds" So i just turned it off. what a wack=我没法让他停下。但我说他在一堵大墙的另一边，而我能把他弄出来。我说他在大楼里面。然后他就开始崩溃。我听不清他说的任何一句话，我觉得他说了什么“吐出果皮”之类的。所以我直接关掉了。真是疯子
I havent felt like writing. no time. but last night I swear i heard dad talking to me from the vent, the one under the charger. i dont feel crazy. Man, thats what they all say, yea yea i know! Well, im writing this log to keep myself sane, right? so ill write about it. he was asking where he was, breathing really deep like he couldnt breath, like he was getting pulled into the engine. he sounded scared. he said he was thirsty=我一直不想写。没时间。但昨晚我发誓，我听见爸爸在和我说话，声音从充电器下面那个通风口里传出来。我不觉得自己疯了。好吧，大家都会这么说，对对我知道！不过我写这篇日志就是为了保持清醒，对吧？那我就写下来。他问自己在哪里，呼吸很重，像是喘不过气，像是正被拖进引擎里。他听起来很害怕。他说他口渴
maybe its cause Im feeling bad, cause we sold the baby bird we stole from that giant wingless one that's always stink-eyeing us on Vow. Man it could run thouggh, we had to leave on the spot, and Mr. Doofus Lucas has been chattering his teeth ever since. im not doing that again.=也许是因为我心里不好受，因为我们卖掉了从 Vow 上那个巨大无翼家伙那里偷来的小鸟。它一直恶狠狠地瞪着我们。老天，它跑得可真快，我们当场就得撤。蠢蛋 Lucas 从那以后一直牙齿打战。我不会再那么做了。
He went all dumb and and said guilty what? For selling the baby bird egg!Then, i cant belive it, he said it's no different than the eggs you eat for breakfast. i said it BROKE OUT AND LOOKED AT US, and i wouldnt eat that! it was ALIVE. And then, what he said. "could it carry scrap? could it get us to the quota? could it raise our efficiency and throughputt and enhance our team synergy, could it bla bla blablablablablblblabalblbalabalbla=他傻乎乎地问，心虚什么？就因为卖掉小鸟蛋！然后，我真不敢相信，他说这和你早餐吃的蛋没区别。我说它破壳出来看着我们，我不会吃那东西！它是活的。然后他说的话是：“它能搬废料吗？能帮我们完成配额吗？能提高效率和吞吐量、增强团队协同吗？能不能叭叭叭叭叭叭
