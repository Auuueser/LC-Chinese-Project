This is Desmond. Sigurd is unable to write. But I feel the need to keep a record, and none of us are sleeping tonight. After the incident, he's practically catatonic. He says he heard his father's voice in the air intake vent under the charger several days ago; I wish he'd told us before the incident, but I'm liable to believe he's being honest at least to himself. In this state he'd be a danger to himself and others, so we've been reduced to a three-man crew--a hard blow I'm afraid we can't afford.=我是 Desmond。Sigurd 无法写字。但我觉得必须留下记录，而且今晚我们没有一个人睡得着。事故之后，他几乎陷入紧张性木僵。他说几天前曾在充电器下面的进气通风口里听见他父亲的声音；我希望他在事故前告诉过我们，但我倾向于相信，至少在他自己看来，他说的是实话。以他现在的状态，他会对自己和他人构成危险，所以我们已经缩减成三人船员组。这是个沉重打击，恐怕我们承受不起。
This is how Jess and Lucas recounted it. There was a scraping sound, of which they soon located the vent as the source. They took this as a sign of the ship needing maintenance and perhaps an oil change. Lucas went to grab the tools just to check. However before he returned, the vent burst with a chunky, red fluid, with what were almost surely bits of bone and hair, which spread across the floor, like the contents of a clogged toilet. Fully emptying the vent, cleaning out the ship, and eradicating the stench was a challenge I wouldn't wish on anyone, especially with Sigurd trying to stop us. Now the smell of bleach burning our nostrils is a relief.=Jess 和 Lucas 是这样复述的。当时有一阵刮擦声，他们很快确认声音来自通风口。他们以为这是飞船需要维护，也许要换油的信号。Lucas 去拿工具，只是想检查一下。但他回来前，通风口爆开，喷出一股浓稠的红色液体，里面几乎肯定混着骨头和毛发，像堵住的马桶内容物一样铺满地板。彻底清空通风口、清理飞船、消除恶臭，是我不愿任何人经历的折磨，尤其是 Sigurd 还试图阻止我们。现在，漂白剂烧灼鼻腔的气味反而让人安心。
Why? Why did it happen? I cannot reasonably entertain Sigurd's "explanation" that somehow his father was inside the ship. He has always been quite imaginative, not to mention his current state. I believe the crew before us--or the crew before that--is simply responsible for attempting to avoid a fine, and the method was to hide their mistake. The victim's remains have been dumped out, and we will never identify them.=为什么？为什么会发生？我不能合理接受 Sigurd 的“解释”，说他父亲不知怎么就在飞船里。他一直很有想象力，更不用说现在这种状态。我相信我们之前的船员组，或者再之前的船员组，只是为了逃避罚款，用这种方式隐藏了他们的错误。受害者遗骸已经被倒了出去，我们永远无法确认身份。
It doesn't matter. As I stated, this is unsustainable. I have followed every step of the handbook. I have tried to make things work. I have maximized our efficiency. I have kept our morale in check. Now, even I am wringing my hands. It's like this job is just designed to break me! I've done everything right, I've done everything I can, and still, we would have to pull a miracle just to get back on track. The only course of action left is to do what I cannot. So maybe I will.=这并不重要。如我所说，这种状态无法维持。我遵守了手册上的每一步。我努力让一切运转。我最大化了我们的效率。我控制住了士气。现在，连我都开始焦虑。这份工作简直像是专门为了击垮我而设计的！我做对了所有事，我尽了一切努力，可即便如此，我们也必须靠奇迹才能回到正轨。剩下唯一的办法，就是去做我不能做的事。也许我会做。
they had me on screen duty, and then they all came waddling back,, but Rich wasn't there, and they said they couldnt find him. Desmond said it turned his neck but he didnt see it. I wanted to find Rich even if he was dead, but they are cowards! their faces are blank like idiots, theres nothing moving in their stupid skulls, all they wanted to do is leave. they were going to leave me too if i went out. we all hated Rich but we didnt want this. this isnt worth it, its just not worth it. we got a pair of scissors, a box full of stamps and a bundle of cords to sell for nothing. its not wort h it, what does the company even want it for?=他们让我盯着屏幕，后来他们全都摇摇晃晃地回来了，可 Rich 不在。他们说找不到他。Desmond 说它转过脖子，但他没看见。我想去找 Rich，哪怕他已经死了，可他们都是懦夫！他们脸上一片空白，像傻子一样，愚蠢的脑袋里什么都没在动；他们只想离开。如果我出去，他们也会把我丢下。我们都讨厌 Rich，但我们不想变成这样。这不值得，真的不值得。我们拿到一把剪刀、一箱邮票和一捆电线，卖不了几个钱。根本不值。公司到底要这些东西干什么？
