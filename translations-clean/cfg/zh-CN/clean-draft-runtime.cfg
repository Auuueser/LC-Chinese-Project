Ive been thinking a lot. i think this job is shady. If youre reading this you probbably got here the same as me. the pay is good, the contract only lasts a season. they ran you through their "assessmennt exam" on the phone with a weird voice. you signed the contract on the shuttle with the rest of your crew. But the whole time you didnt talk to anyone. The shuttle was autopiloted, I think the voice on the phone was fake.  I;ve had the wrost dreams, I think   I just want to go back home. but im not gonna crawl home, crying and scratching on dad's front door. thats not his son. thats not Sigurd!=我想了很多。我觉得这份工作很可疑。如果你正在读这个，你大概也是像我一样来到这里的。薪水不错，合同只持续一个季度。他们让你在电话里听着一个怪声音完成“评估考试”。你和其他船员一起在穿梭机上签了合同。但整个过程中你没和任何人真正说过话。穿梭机是自动驾驶的，我觉得电话里的声音是假的。我做了很糟的梦，我想……我只是想回家。但我不会哭着爬回去，抓挠我爸家的前门。那不是他的儿子。那不是 Sigurd！
