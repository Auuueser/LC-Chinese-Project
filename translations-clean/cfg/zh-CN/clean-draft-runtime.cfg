i was talking about how the voice on the phone sounded fake. Then Desmond got this weird idea. he's the wizard and all so he thinks theres a way to use the phone call i made to the company number to find ourt where the voice comes from. i dont know why hed want to do that but he seems serious. He;s been using the terminal a lot.=我当时在说电话里的声音听起来很假。然后 Desmond 想到了一个怪主意。他是那个巫师之类的，所以他觉得有办法利用我打给公司号码的那通电话，查出声音到底来自哪里。我不知道他为什么想这么做，但他看起来很认真。他最近一直在用终端。
desmond wants me to writ e down what we figured out and keep my "nonsense to a minimum". So im going to put SO MUCH of my non sense. screw him. The new crew member is named Lucas and he is so confused and scared a ll the time, what a baby, at least he doesnt smell like a monster. its been so sunny even though its september, and these suits dont take it well=Desmond 想让我把我们弄明白的东西写下来，还让我“少写废话”。所以我要写超多废话。去他的。新船员叫 Lucas，他一直又困惑又害怕，真是个小宝宝，至少他闻起来不像怪物。虽然已经九月了，太阳还是很晒，这些制服根本扛不住
i keep having bad dreams about the Company building where the Company breaks out of that giant concrete wall. But i dont know if it looks like anything, i just think its really fast, and its so big it covers the sky. We cant figure out a way to know if the voices on the phone are real, desmond says its too far away. i asked him if he could ttake control of the autopilot and he said im crazy and that could kill us. yes i am crazy desmond=我总是做关于公司大楼的噩梦，梦见公司从那面巨大的混凝土墙里冲出来。但我不知道它到底长什么样，我只觉得它非常快，大到能遮住天空。我们想不出办法确认电话里的声音到底是不是真的，Desmond 说距离太远了。我问他能不能接管自动驾驶，他说我疯了，还说那会害死我们。对，我是疯了，Desmond
i started wondering how i cant remember how we really got here, no I just remember little things like the shuttle flight to the building where we signed our contracts. But i dont remember getting on the shuttle, i dont even remember saying bye to dad. sometmies i feel this deep pit in my stomache and i have to think just to remember my name. in my dreams it feels like the company isnt trapped in there at all, its just hiding. I dont know if were going home=我开始纳闷，为什么我想不起自己到底是怎么来到这里的。不，我只记得一些零碎片段，比如坐穿梭机去那栋签合同的大楼。但我不记得自己上了穿梭机，甚至不记得有没有和爸爸道别。有时候我胃里会突然陷下去，必须努力想，才想得起自己的名字。在梦里，公司根本不像被困在那里，它只是躲在那里。我不知道我们还能不能回家
