Use the "PING" command before the radar booster's name to play a special sound from the device=在雷达增强器名称前使用“PING”命令，让设备播放特殊声音
Tip: This may occur due to an antivirus or other software halting the save file from being read.=提示：这可能是杀毒软件或其他软件阻止读取存档造成的。
With an extra battery life and even brighter bulb, your colleagues can never leave you in the dark again=更长续航和更亮灯泡，让同事再也不能把你留在黑暗中
Could not connect to Steam servers! (If you just want to play on your local network, choose LAN on launch.)=无法连接到 Steam 服务器！（如果只想在本地网络游玩，请在启动时选择 LAN。）
Use the "SWITCH" command before the radar booster's name to view it on the main monitor. It must be activated=在雷达增强器名称前使用“SWITCH”命令，即可在主监视器查看它。它必须处于激活状态
Use the "transmit" command to broadcast a text message to all crewmates. The message must be under 10 letters=使用“transmit”命令向所有船员广播文本消息。消息必须少于 10 个字符
While moving furniture with [B], you can press [X] to send it to storage. You can call it back from storage here.=使用 [B] 移动家具时，可按 [X] 将其送入仓库。你可以在这里从仓库召回。
