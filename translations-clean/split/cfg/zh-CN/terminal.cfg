Circuit Bees\\n\\nSigurd's danger level: 90%\\n\\nScientific name: Crabro-coruscus\\nThe circuit bee, also known as red bee, is a eusocial flying insect of the genus Apis, a descendent of the honey bee. Their appearance is quite recognizable from their hairy, red bodies and two sets of wings. Like their ancestors, they are well-known for their intelligent social BEEhavior, large colony size, building wax nests which they use to store honey, and their important role in pollination. Unlike the honey bee, which often chose high places such as trees to construct its hive, red bees create their hives on the ground.\\n\\nRed bees are highly defensive. They will leave the nest to attack any creature that comes within several meters, leaving BEEhind only the queen and drone bees. This bold BEEhavior is enabled by their most defining aBEElity, which is their electrostatic charge. Red bees produce friction with the air. They also produce friction by rubbing their two pairs of wings against each other and by rubbing against one another while in the hive. What allows them to create such a surplus of electric field compared to the honey bee is still under research, as they generate a stronger electric field when panicked or angered. This ability is especially useful for them around water.\\n\\n\\n\\nIt's BEEst to keep your distance. If a red bee hive is stolen, red bee swarms will enter an onslaught in which they attack any living creature. This destructive BEEhavior will last until they have located the hive or completely exhausted themselves, which can take hours to days. They have BEEn known to leave BEEhind fields of bodies of small rodents, insects and even some larger mammals, and in rare cases they can start fires. Their strong BEEnefits and drawbacks to their ecosystems are highly debated. BEEbated !! - the indomitable Sigurd=电路蜂\n\n西格德危险等级：90%\n\n学名：Crabro-coruscus\n电路蜂，也称红蜂，是蜜蜂属的真社会性飞行昆虫，是蜜蜂的后代。它们毛茸茸的红色身体和两对翅膀很容易辨认。和祖先一样，它们以聪明的社会行为、庞大的群落规模、筑蜡巢储蜜以及重要的授粉作用而知名。不同于常选择树木等高处筑巢的蜜蜂，红蜂会在地面建立蜂巢。\n\n红蜂防御性极强。任何生物进入几米范围内，它们都会离巢攻击，只留下蜂后和雄蜂。这种大胆行为来自其最突出的能力：静电荷。红蜂会与空气摩擦，也会让两对翅膀彼此摩擦，并在巢内相互摩擦。它们为何比蜜蜂产生如此过量的电场仍在研究中；当恐慌或愤怒时，它们会产生更强电场。这种能力在水边尤其有用。\n\n\n\n最好保持距离。如果红蜂蜂巢被偷，红蜂群会进入猛攻状态，攻击任何活物。这种破坏性行为会持续到它们找到蜂巢或完全耗尽体力，可能持续数小时到数天。已知它们会留下小型啮齿动物、昆虫甚至部分大型哺乳动物的尸体，有少数情况下还会引发火灾。它们对生态系统强烈的利弊仍存在很大争议。蜂议！！——不可征服的西格德
